theme:
  name: material
  language: uk
  
  palette:
    # Світла тема
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Переключити на темну тему

    # Темна тема (Slate)
    - scheme: slate
      primary: blue        # Яскравіший синій для кращого контрасту
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Переключити на світлу тему


  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - header.autohide
    - search.suggest
    - search.highlight
    - content.code.copy

font:
  text: Roboto
  code: JetBrains Mono

markdown_extensions:
  - md_in_html # <Підключення формул
  - admonition
  - pymdownx.details
  # Підтримка Mermaid діаграм
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  # Формули LaTeX
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

hooks:
  - hooks/gfm_fixer.py

# Підключення MathJax для рендерингу формул
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

copyright: 'Copyright &copy; 2026 Kyrylo Vadurin &bull; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>'

